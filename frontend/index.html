<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arobiy Education</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Telefon so'rash oynasi -->
  <div id="phone-gate" class="phone-gate hidden">
    <div class="phone-gate-card">
      <p class="phone-gate-title">Botdan to'liq foydalanish uchun</p>
      <p class="phone-gate-subtitle">raqamingizni ulashing</p>
      <button id="share-phone-btn" class="primary-btn">📱 Raqamni ulashish</button>
    </div>
  </div>

  <!-- Har bir tab uchun sahifa konteynerlari -->
  <main id="content" class="content"></main>

  <!-- Pastki navigatsiya -->
  <nav class="bottom-nav">
    <button class="nav-item" data-tab="profil">
      <span class="nav-icon">👤</span><span class="nav-label">Profil</span>
    </button>
    <button class="nav-item" data-tab="daraja">
      <span class="nav-icon">🎯</span><span class="nav-label">Daraja</span>
    </button>
    <button class="nav-item active" data-tab="organish">
      <span class="nav-icon">📖</span><span class="nav-label">O'rganish</span>
    </button>
    <button class="nav-item" data-tab="mashqlar">
      <span class="nav-icon">✏️</span><span class="nav-label">Mashqlar</span>
    </button>
    <button class="nav-item" data-tab="lugat">
      <span class="nav-icon">📚</span><span class="nav-label">Lug'at</span>
    </button>
  </nav>

</div>

<script src="js/app.js"></script>
</body>
</html>
